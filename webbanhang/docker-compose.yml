version: "3.9"

services:
  web:
    build: .
    container_name: webbanhang_app
    restart: always
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"

  nginx:
    image: nginx:latest
    container_name: webbanhang_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

volumes:
  static_volume:
